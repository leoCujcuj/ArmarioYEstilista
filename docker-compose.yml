version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: armario-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend-node
    networks:
      - armario-network

  backend-node:
    build: ./backend-node
    container_name: armario-backend-node
    ports:
      - "3000:3000"
    volumes:
      - ./backend-node:/app
      - backend_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_USER=armario_user
      - DB_PASS=armario_pass
      - DB_NAME=armario_db
      - MONGO_URI=mongodb://mongo:27017/armario
      - PYTHON_API_URL=http://backend-python:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_started
      mongo:
        condition: service_started
      redis:
        condition: service_started
      backend-python:
        condition: service_healthy
    networks:
      - armario-network

  backend-python:
    build: ./backend-python
    container_name: armario-backend-python
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app
    environment:
      - NODE_API_URL=http://backend-node:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - armario-network

  postgres:
    image: postgres:15
    container_name: armario-postgres
    environment:
      POSTGRES_USER: armario_user
      POSTGRES_PASSWORD: armario_pass
      POSTGRES_DB: armario_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - armario-network

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - armario-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - armario-network

networks:
  armario-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  frontend_node_modules:
  backend_node_modules:
